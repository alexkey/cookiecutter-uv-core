[project]
name = "{{ cookiecutter.service_name }}"
version = "{{ cookiecutter.version }}"
# Dynamic versioning is disabled because of:
# https://github.com/astral-sh/uv/issues/8714
#
# dynamic = ["version"]

description = "{{ cookiecutter.brief }}"
license = "{{ cookiecutter.license }}"  # <- or "LicenseRef-Proprietary"
license-files = [
    "LICENSE",
]
authors = [
    { name="{{ cookiecutter.author_name }}", email="{{ cookiecutter.author_email }}" },
]
maintainers = [
    { name="{{ cookiecutter.author_name }}", email="{{ cookiecutter.author_email }}" },
]
readme = "README.rst"
homepage = "{{ cookiecutter.url }}"
repository = "{{ cookiecutter.repository }}"
documentation = ""
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: {{ cookiecutter.python_majmin }}",
]
requires-python = "~={{ cookiecutter.python_version }}"
dependencies = [
    "alembic~=1.20.0",
    "celery~=5.6.3",
    "click~=8.5.0",
    "fastapi~=0.162.0",
    "httpx2~=2.16.0",
    "jinja2~=3.1.6",
    "pydantic-settings~=2.16.0",
    "pydantic~=2.14.1",
    "redis~=8.1.0",
    "rich~=15.0.0",
    "sqlalchemy[postgresql-asyncpg,mypy]~=2.1.8",
    "structlog~=26.1.0",
    "uvicorn[standard]~=0.54.0",
]

[project.optional-dependencies]

[project.scripts]
# Each entry installs a console script. Run the application with
# `{{ cookiecutter.service_name }}` in the project environment, or with
# `uv run {{ cookiecutter.service_name }}` from the project directory.

{{ cookiecutter.service_name }} = "{{ cookiecutter.repo_name }}.app.cli:main"

[build-system]
requires = ["uv_build>={{ cookiecutter.uv_version }}"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The build backend expects the module directory `module-name` inside `src`, as in
# this layout:
#
# pyproject.toml
# src
# └── foo
#     ├── __init__.py
#     ├── bar
#     │   └── __init__.py
#     └── baz
#         └── __init__.py
module-name = "{{ cookiecutter.repo_name }}"
namespace = false

# Glob patterns of additional files and directories to include in the source
# distribution.
source-include = []

# Glob patterns of files and directories to remove from both distributions. The
# default exclusions `__pycache__`, `*.pyc`, and `*.pyo` apply in addition.
source-exclude = []

# Directories to include in the source distribution and to copy into the `.data`
# directory of the wheel. The setting reference describes the format:
# https://docs.astral.sh/uv/reference/settings/#build-backend_data
data = []

[tool.uv]
# Build the project and install it into the project environment as a package.
package = true

default-groups = ["dev"]

[dependency-groups]
dev = [
    { include-group = "types" },
    { include-group = "check" },
    { include-group = "test" },

    "icecream>=2.2.0",
    "sqlalchemy[postgresql-asyncpg,mypy]~=2.1.8",
    "watchfiles>=1.2.0",
]
types = [
    "types-PyYAML",
    "types-Pygments",
    "types-colorama",
    "types-greenlet",
    "types-pexpect",
]
check = [
    "deptry~=0.25.1",
    "mypy~=2.4.0",
    "pylint~=4.1.3",
    "ruff~=0.17.1",
    "ty~=0.0.97",
]
test = [
    "pytest-asyncio~=1.4.0",
    "pytest-repeat>=0.9.4",
    "pytest~=9.2.0",
]

[tool.deptry]
# Modules that deptry treats as first-party in addition to the detected ones.
known_first_party = ["tests"]

[tool.deptry.per_rule_ignores]
DEP001 = [
    # Imported but missing from the dependency definitions.

    # The project does not list itself as a dependency.
    "{{ cookiecutter.service_name }}",
]
DEP002 = [
    # Declared as a dependency but not imported in the codebase.

    "rich",  # <- `structlog.dev.RichTracebackFormatter` requires
    "uvicorn",
]
DEP004 = [
    # Imported but declared as a development dependency.
    "pytest",
]
